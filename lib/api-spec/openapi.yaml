openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Public website, appointments, referrals, and protected clinic administration.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public clinic information and patient workflows
  - name: admin
    description: Protected administrative workflows
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /locations:
    get:
      operationId: listLocations
      tags: [public]
      summary: List clinic locations and published weekly hours
      responses:
        "200":
          description: Clinic locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicLocation"
  /contact:
    post:
      operationId: createContactMessage
      tags: [public]
      summary: Send a practice contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Contact message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageConfirmation"
        "400":
          description: Invalid contact details
        "503":
          description: Contact service is unavailable
  /availability:
    get:
      operationId: getAvailability
      tags: [public]
      summary: Get published bookable slots for a clinic and local date
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: Available and unavailable time slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
  /appointments:
    post:
      operationId: createAppointment
      tags: [public]
      summary: Reserve an online appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created after a successful database reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmation"
        "409":
          description: Slot is no longer available
        "503":
          description: Booking service is not configured
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      tags: [public]
      summary: Cancel an appointment with its private management token
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCancelInput"
      responses:
        "200":
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSummary"
        "403":
          description: Invalid management token
        "404":
          description: Appointment not found
  /appointments/{appointmentId}/reschedule:
    post:
      operationId: rescheduleAppointment
      tags: [public]
      summary: Reschedule an appointment with its private management token
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRescheduleInput"
      responses:
        "200":
          description: Appointment rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSummary"
        "409":
          description: Requested slot is no longer available
        "403":
          description: Invalid management token
  /webhooks/resend:
    post:
      operationId: receiveResendWebhook
      tags: [public]
      summary: Record verified Resend delivery events
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendWebhookPayload"
      responses:
        "204":
          description: Webhook event recorded
        "400":
          description: Invalid webhook signature or payload
  /referral-uploads/reservations:
    post:
      operationId: reserveReferralUpload
      tags: [public]
      summary: Reserve a short-lived referral file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralUploadInput"
      responses:
        "201":
          description: Short-lived one-time upload authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralUploadReservation"
        "503":
          description: Cloudinary is not configured
  /referral-uploads/{uploadId}/content:
    put:
      operationId: uploadReferralFile
      tags: [public]
      summary: Validate and privately store a referral attachment
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReferralFileUpload"
      responses:
        "201":
          description: Attachment validated and stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralUploadComplete"
        "400":
          description: Invalid, expired, or mismatched upload
        "413":
          description: File exceeds the 10 MB limit
        "503":
          description: Cloudinary is not configured
  /referrals:
    post:
      operationId: createReferral
      tags: [public]
      summary: Submit a dentist-to-specialist referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralInput"
      responses:
        "201":
          description: Referral recorded and assigned a reference number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralConfirmation"
        "503":
          description: Referral service is not configured
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in an existing administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid sign-in details
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current authenticated administrator
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not signed in
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the current administrator session
      responses:
        "204":
          description: Session ended
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get a compact clinic operations overview
      responses:
        "200":
          description: Counts and upcoming activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Not signed in
  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [admin]
      summary: List recent email delivery states without exposing message content
      responses:
        "200":
          description: Recent notification delivery states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNotification"
        "401":
          description: Not signed in
  /admin/notifications/{notificationId}/retry:
    post:
      operationId: retryAdminNotification
      tags: [admin]
      summary: Safely retry a failed notification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "401":
          description: Not signed in
        "409":
          description: Notification is not eligible for retry
  /admin/appointments:
    get:
      operationId: listAdminAppointments
      tags: [admin]
      summary: Search appointments for authorized clinic staff
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: locationId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingSource"
      responses:
        "200":
          description: Matching appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAppointment"
        "401":
          description: Not signed in
    post:
      operationId: createPhoneAppointment
      tags: [admin]
      summary: Reserve an appointment taken by phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneAppointmentInput"
      responses:
        "201":
          description: Phone appointment reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "409":
          description: Slot is no longer available
        "401":
          description: Not signed in
  /admin/appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAdminAppointment
      tags: [admin]
      summary: Cancel an appointment after an explicit confirmation
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCancelInput"
      responses:
        "200":
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "401":
          description: Not signed in
  /admin/appointments/{appointmentId}/reschedule:
    post:
      operationId: rescheduleAdminAppointment
      tags: [admin]
      summary: Reschedule an appointment after an explicit confirmation
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRescheduleInput"
      responses:
        "200":
          description: Appointment rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "409":
          description: Requested slot is no longer available
        "401":
          description: Not signed in
  /admin/appointments/{appointmentId}/complete:
    post:
      operationId: completeAdminAppointment
      tags: [admin]
      summary: Mark a past appointment complete
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionInput"
      responses:
        "200":
          description: Appointment marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppointment"
        "401":
          description: Not signed in
        "409":
          description: Appointment is not eligible for completion
  /admin/referrals:
    get:
      operationId: listAdminReferrals
      tags: [admin]
      summary: List submitted referrals for authorized clinic staff
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReferralStatus"
      responses:
        "200":
          description: Referrals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminReferral"
        "401":
          description: Not signed in
  /admin/referrals/{referralId}/status:
    patch:
      operationId: updateReferralStatus
      tags: [admin]
      summary: Update a referral status and internal note
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralStatusInput"
      responses:
        "200":
          description: Updated referral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReferral"
        "401":
          description: Not signed in
  /admin/referrals/{referralId}/attachments/{uploadId}/access-url:
    post:
      operationId: requestReferralAttachmentAccessUrl
      tags: [admin]
      summary: Request a short-lived private read URL for an authorized referral attachment
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: string
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Short-lived authorized read URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralAttachmentAccess"
        "401":
          description: Not signed in
        "404":
          description: Attachment not found
  /admin/schedules:
    get:
      operationId: listAdminSchedules
      tags: [admin]
      summary: List editable clinic schedules
      responses:
        "200":
          description: Clinic schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSchedule"
        "401":
          description: Not signed in
  /admin/locations/{locationId}:
    put:
      operationId: updateAdminLocation
      tags: [admin]
      summary: Update clinic location details
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicLocationInput"
      responses:
        "200":
          description: Updated clinic location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicLocation"
        "401":
          description: Not signed in
  /admin/availability-overrides:
    get:
      operationId: listAdminAvailabilityOverrides
      tags: [admin]
      summary: List configured holidays and date-specific availability
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: locationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Date-specific overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityOverride"
        "401":
          description: Not signed in
    post:
      operationId: createAdminAvailabilityOverride
      tags: [admin]
      summary: Publish emergency or extra availability or block a date or slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityOverrideInput"
      responses:
        "201":
          description: Availability override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityOverride"
        "401":
          description: Not signed in
  /admin/availability-overrides/{overrideId}:
    delete:
      operationId: deleteAdminAvailabilityOverride
      tags: [admin]
      summary: Remove a date-specific availability override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Availability override removed
        "401":
          description: Not signed in
        "404":
          description: Override not found
  /admin/contact-messages:
    get:
      operationId: listAdminContactMessages
      tags: [admin]
      summary: View contact messages for authorized practice staff
      responses:
        "200":
          description: Recent contact messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"
        "401":
          description: Not signed in
  /admin/schedules/{locationId}:
    put:
      operationId: updateAdminSchedule
      tags: [admin]
      summary: Update one clinic's weekly schedule
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSchedule"
        "401":
          description: Not signed in
components:
  schemas:
    ResendWebhookPayload:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NotificationStatus:
      type: string
      enum: [accepted, delivered, failed, not_configured]
    ClinicLocation:
      type: object
      required: [id, name, clinicName, address, mapsUrl, phone, weeklyHours]
      properties:
        id: { type: string }
        name: { type: string }
        clinicName: { type: string }
        address: { type: string }
        mapsUrl: { type: string, format: uri }
        phone: { type: ["string", "null"] }
        weeklyHours:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyHours"
    ClinicLocationInput:
      type: object
      required: [name, clinicName, address, mapsUrl, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        clinicName: { type: string, minLength: 2, maxLength: 160 }
        address: { type: string, minLength: 8, maxLength: 400 }
        mapsUrl: { type: string, format: uri }
        phone: { type: ["string", "null"], maxLength: 24 }
    WeeklyHours:
      type: object
      required: [day, opensAt, closesAt]
      properties:
        day: { type: integer, minimum: 0, maximum: 6 }
        opensAt: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        closesAt: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    Slot:
      type: object
      required: [id, startsAt, endsAt, label, available, emergency]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        label: { type: string }
        available: { type: boolean }
        emergency: { type: boolean }
    AvailabilityResponse:
      type: object
      required: [locationId, date, timezone, bookingEnabled, slots]
      properties:
        locationId: { type: string }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        timezone: { type: string, const: Asia/Kolkata }
        bookingEnabled: { type: boolean }
        unavailableReason: { type: ["string", "null"] }
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]
    BookingSource:
      type: string
      enum: [online, phone]
    AppointmentInput:
      type: object
      required: [locationId, date, slotId, patientName, phone, email, appointmentType]
      properties:
        locationId: { type: string, minLength: 1 }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        slotId: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        patientName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 8, maxLength: 24 }
        email: { type: string, format: email }
        appointmentType: { type: string, minLength: 2, maxLength: 80 }
        notes: { type: string, maxLength: 1500 }
    AppointmentConfirmation:
      type: object
      required: [id, reference, locationName, date, time, status, managementToken, emailStatus]
      properties:
        id: { type: string }
        reference: { type: string }
        locationName: { type: string }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        time: { type: string }
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        managementToken:
          type: string
          description: Private one-time display token; store securely and never place in a URL.
        emailStatus:
          $ref: "#/components/schemas/NotificationStatus"
    AppointmentSummary:
      type: object
      required: [id, reference, status, date, time]
      properties:
        id: { type: string }
        reference: { type: string }
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        time: { type: string }
    AppointmentCancelInput:
      type: object
      required: [managementToken]
      properties:
        managementToken: { type: string, minLength: 20 }
        reason: { type: string, maxLength: 500 }
    AppointmentRescheduleInput:
      type: object
      required: [managementToken, locationId, date, slotId]
      properties:
        managementToken: { type: string, minLength: 20 }
        locationId: { type: string, minLength: 1 }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        slotId: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    ReferralUploadInput:
      type: object
      required: [fileName, contentType, fileSize]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 180 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        fileSize: { type: integer, minimum: 1, maximum: 10485760 }
    ReferralFileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ReferralUploadReservation:
      type: object
      required: [uploadId, uploadToken, expiresAt]
      properties:
        uploadId: { type: string }
        uploadToken:
          type: string
          description: One-time opaque upload token. Never store it in MongoDB or logs.
        expiresAt: { type: string, format: date-time }
    ReferralUploadComplete:
      type: object
      required: [uploadId, status]
      properties:
        uploadId: { type: string }
        status: { type: string, const: uploaded }
    ReferralRequestType:
      type: string
      enum:
        - Root Canal Treatment
        - Root Canal Retreatment
        - Persistent pain or symptoms
        - Complex endodontic case
        - Dental trauma
        - Tooth fracture
        - Endodontic assessment or second opinion
        - Other
    ExistingRestoration:
      type: string
      enum:
        - No existing restoration
        - Direct restoration
        - Temporary restoration
        - Crown
        - Post and core
        - Other
        - Unknown
    CoronalRestoration:
      type: string
      enum:
        - Direct restoration
        - Full-coverage crown
        - Onlay or overlay
        - Fiber-Reinforced Restoration
        - Other
        - To be decided after clinical assessment
    ReferralInput:
      type: object
      required:
        - submissionId
        - referralDate
        - dentistName
        - practiceName
        - dentistPhone
        - dentistEmail
        - practiceAddress
        - patientName
        - patientPhone
        - requestTypes
        - selectedTeeth
        - existingRestoration
        - coronalRestoration
        - relevantClinicalInformation
        - authorizationConfirmed
      properties:
        submissionId: { type: string, format: uuid }
        referralDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        dentistName: { type: string, minLength: 2, maxLength: 120 }
        practiceName: { type: string, minLength: 2, maxLength: 160 }
        dentistPhone: { type: string, minLength: 8, maxLength: 24 }
        dentistEmail: { type: string, format: email }
        dentistRegistrationNumber: { type: ["string", "null"], maxLength: 80 }
        practiceAddress: { type: string, minLength: 8, maxLength: 400 }
        patientName: { type: string, minLength: 2, maxLength: 120 }
        patientPhone: { type: string, minLength: 8, maxLength: 24 }
        patientEmail: { type: ["string", "null"], format: email }
        patientGender: { type: ["string", "null"], maxLength: 40 }
        patientAge: { type: ["integer", "null"], minimum: 0, maximum: 120 }
        dateOfBirth:
          type: ["string", "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        selectedTeeth:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [11, 12, 13, 14, 15, 16, 17, 18, 21, 22, 23, 24, 25, 26, 27, 28, 31, 32, 33, 34, 35, 36, 37, 38, 41, 42, 43, 44, 45, 46, 47, 48]
        requestTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
