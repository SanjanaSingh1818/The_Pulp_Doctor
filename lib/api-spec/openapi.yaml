        coronalRestoration:
          $ref: "#/components/schemas/CoronalRestoration"
        relevantClinicalInformation: { type: string, maxLength: 4000 }
        restorativePlan: { type: string, maxLength: 2000 }
        clinicalComments: { type: string, maxLength: 4000 }
        preferredDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        preferredTime: { type: ["string", "null"] }
        uploadIds:
          type: array
          maxItems: 5
